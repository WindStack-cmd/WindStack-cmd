name: Update profile contribution art

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight contribution dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh public contribution data
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/test_profile_art.py
      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph [skip ci]"
          git push
